name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  scripts-unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/scripts-test.sh

  scripts-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1
        shell: powershell
        run: ./tests/scripts-test.ps1
      - name: PowerShell 7
        shell: pwsh
        run: ./tests/scripts-test.ps1
